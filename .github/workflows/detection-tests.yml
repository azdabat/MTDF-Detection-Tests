name: detection-tests

# On every push and pull request:
#   1. lint every rule (ERROR findings fail the build)
#   2. run every detection test on a throwaway Azure Data Explorer engine (Kustainer)
#   3. publish a results table on the run page
#   4. on main, when no blocking test failed: regenerate the README coverage table,
#      the per-detection pages and the ATT&CK Navigator layer, and commit them back
#
# Nothing is ingested: each test is one self-contained query (fixture tables as
# let-bound datatables in front of the unchanged rule).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: detection-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      kustainer:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
        ports:
          - 8080:8080
        env:
          ACCEPT_EULA: "Y"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint rules
        run: python tools/lint_kql.py detections --no-port

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile check (Microsoft Kusto language service)
        run: |
          npm install --prefix tools/semantic --no-audit --no-fund
          python tools/semantic_check.py

      - name: Wait for Kustainer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/v1/rest/query \
                 -H 'Content-Type: application/json' \
                 -d '{"db":"NetDefaultDB","csl":"print ready=1"}' >/dev/null 2>&1; then
              echo "kustainer ready"; exit 0
            fi
            echo "waiting for kustainer ($i/60)"; sleep 5
          done
          echo "kustainer did not start"; exit 1

      - name: Run detection tests
        id: tests
        env:
          ADX_CLUSTER: http://localhost:8080
          ADX_DB: NetDefaultDB
        run: python tools/run_tests.py --json docs/results.json

      - name: Build docs
        if: always() && steps.tests.outcome != 'skipped'
        run: python tools/build_docs.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-results
          path: |
            docs/
            detections/*/*/README.md
            README.md
          if-no-files-found: ignore

      - name: Commit generated docs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.tests.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs README.md detections
          if git diff --cached --quiet; then echo "docs unchanged"; exit 0; fi
          git commit -m "docs: coverage from test run ${{ github.run_number }} [skip ci]"
          git push
