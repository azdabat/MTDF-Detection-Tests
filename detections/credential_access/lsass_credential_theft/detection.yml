# Detection metadata - source of truth for the generated README in this folder.
title: LSASS Credential Theft - Master Composite (L3)
author: Ala Dabat
techniques:
- T1003.001
- T1003.002
minimum_truth: 'LSASS memory is touched or dumped: a dump command (comsvcs MiniDump, a known dumping tool), an LSASS
