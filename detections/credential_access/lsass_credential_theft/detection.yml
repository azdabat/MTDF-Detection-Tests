reinforcement: Multiple independent signals converging on the same host and account; LOLBin (comsvcs) usage.
data_sources:
- DeviceProcessEvents
- DeviceFileEvents
- DeviceEvents
platforms:
- Microsoft Defender XDR Advanced Hunting
- Microsoft Sentinel (MDE connector)
production_lookback: 7d
source_rule: COMPOSITE_L3_LSASS_CREDENTIAL_THEFT_MASTER
