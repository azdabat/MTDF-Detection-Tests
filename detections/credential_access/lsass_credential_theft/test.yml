name: LSASS credential theft - comsvcs.dll MiniDump (OTRF)
rule: COMPOSITE_L3_LSASS_CREDENTIAL_THEFT_MASTER.kql
fixture: fixtures
technique: T1003.001
source: OTRF psh_lsass_memory_dump_comsvcs
source_url: https://github.com/OTRF/Security-Datasets/blob/master/datasets/atomic/windows/credential_access/host/psh_lsass_memory_dump_comsvcs.zip
catches: "rundll32 comsvcs.dll MiniDump of lsass scored CRITICAL"
notes: >
  Cousin implementation of LSASS dumping (LOLBin, not Empire). The rule must
  score the comsvcs MiniDump command line as CRITICAL.
maturity: experimental
expect:
  must_fire: true
  contains:
    - Severity: ["CRITICAL"]
  columns: [RiskScore, Severity, Techniques, EvidenceList, Hunter_Directive]
