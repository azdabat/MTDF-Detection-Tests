name: LSA / SSP persistence - WDigest downgrade (Empire)
rule: Registry_Persistence_LSA_SecurityProviders.kql
fixture: fixtures
technique: T1547.009
source: OTRF empire_wdigest_downgrade
source_url: https://github.com/OTRF/Security-Datasets/blob/master/datasets/atomic/windows/defense_evasion/host/empire_wdigest_downgrade.tar.gz
catches: "SecurityProviders\\WDigest\\UseLogonCredential = 1 set by powershell.exe"
notes: >
  Empire sets Control\SecurityProviders\WDigest\UseLogonCredential = 1 via PowerShell,
  re-enabling cleartext credential caching in LSASS. One malicious write among 97
  registry events; the rule must surface it.
maturity: experimental
expect:
  must_fire: true
  contains:
    - RegistryValueName: ["UseLogonCredential"]
  columns: [RiskScore, RiskLevel, HunterDirective, RegistryKey]
