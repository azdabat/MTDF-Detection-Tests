# Reviewed verdicts for cross-capture hits in docs/precision.md.
# A hit is a rule firing on a capture its own tests do not claim. Classify each one:
#   tp  the capture genuinely contains the behaviour the rule detects (say what, in the reason)
#   fp  the rule should not have fired: a rule bug to fix (say why)
# Unreviewed hits show as "review" in the matrix and never count as passes.
#
# reviews:
#   <detection folder>:
#     <capture>: {verdict: tp, reason: "..."}
reviews:
  ntds_credential_dumping:
    cmd_psexec_lsa_secrets_dump:
      verdict: tp
      reason: >-
        The capture is filed under lateral movement, but what PsExec runs on the target is a
        credential dump: `reg save HKLM\security\policy\secrets` to the user's Temp folder
        (LSA secrets, T1003.004). The rule's hive signal (HKLM\SECURITY) scores it 60, a HIGH
        hive-dump alert. Correct, and a second implementation of the hive-dump path.
